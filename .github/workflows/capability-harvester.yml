name: Capability Harvester Evidence
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile source
        run: python -m compileall -q vxruntime tests
      - name: Run focused evidence tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -p test_capability_harvester.py -v 2>&1 | tee capability-harvester-tests.txt
      - name: Install existing suite dependency
        run: python -m pip install pytest
      - name: Run all regression tests
        run: python -m pytest -q
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-harvester-evidence
          path: capability-harvester-tests.txt
