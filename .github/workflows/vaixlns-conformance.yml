name: VX Runtime Conformance
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Contract present
        run: test -f VAIXLNS_REPOSITORY_CONTRACT.md
      - name: Install test runner and optional SCCK verifier
        run: python -m pip install --disable-pip-version-check pytest -r requirements-scck.txt
      - name: Compile runtime
        run: python -m compileall -q vxruntime tests
      - name: Execute runtime tests
        run: python -m pytest -q
      - name: Deterministic runtime evidence
        run: |
          python - <<'PY'
          from vxruntime import ExecutionPolicy, VXRuntime
          rt = VXRuntime(policy=ExecutionPolicy(allowed_capabilities=frozenset({"math.add"})))
          r = rt.execute("ci-evidence-001", "math.add", {"a": 21, "b": 21}, lambda p: p["a"] + p["b"])
          assert r.status.value == "success"
          assert rt.replay("ci-evidence-001", lambda p: p["a"] + p["b"])
          assert rt.verify()
          print("execution=success")
          print("replay=match")
          print("ledger=valid")
          PY
      - name: External integration boundary
        run: python -m pytest -q tests/test_external_integration.py
      - name: Municipal local E2E and restart
        run: |
          python -m vxruntime.municipal_demo --output-dir /tmp/vx-municipal-ci
          python -m vxruntime.municipal_demo --output-dir /tmp/vx-municipal-ci
      - name: Upload municipal local test evidence
        uses: actions/upload-artifact@v4
        with:
          name: municipal-local-test-evidence
          path: |
            /tmp/vx-municipal-ci/metrics.json
            /tmp/vx-municipal-ci/execution.jsonl
      - name: Emit evidence
        run: |
          printf 'repository=%s\ncommit=%s\n' "$GITHUB_REPOSITORY" "$GITHUB_SHA" > conformance-evidence.txt
