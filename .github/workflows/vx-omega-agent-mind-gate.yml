name: VX Omega Agent-Mind Gate
on:
  push:
    branches: [feat/vx-omega-evolution-forge-agent-minds-v1]
    paths:
      - "vxruntime/agent_mind_registry.py"
      - "tests/test_agent_mind_registry.py"
      - ".github/workflows/vx-omega-agent-mind-gate.yml"
  pull_request:
    paths:
      - "vxruntime/agent_mind_registry.py"
      - "tests/test_agent_mind_registry.py"
      - ".github/workflows/vx-omega-agent-mind-gate.yml"
permissions:
  contents: read
jobs:
  offline-admission:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax check
        run: python -m py_compile vxruntime/agent_mind_registry.py tests/test_agent_mind_registry.py
      - name: Run fail-closed regression suite
        run: python -m unittest discover -s tests -p test_agent_mind_registry.py -v
